<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sound Travels Ear Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ── POINT 16: CSS custom properties — light mode (default) ── */
  :root {
    --bg:              #fafaf8;
    --bg-card:         #ffffff;
    --bg-chip:         #ffffff;
    --bg-chip-active:  #e6f4f1;
    --bg-hover:        #f2f2f0;
    --border:          #e0e0dc;
    --border-active:   #4a9e8e;
    --text:            #1a1a18;
    --text-muted:      #666660;
    --text-faint:      #999994;
    --accent:          #4a9e8e;
    --accent-dark:     #357a6c;
    --accent-text:     #1d5248;
    --correct:         #2a7a55;
    --correct-bg:      #eaf7f1;
    --correct-border:  #5cb890;
    --wrong:           #a03030;
    --wrong-bg:        #fdf0f0;
    --wrong-border:    #e08080;
    --shadow:          rgba(0,0,0,0.07);
    --shadow-md:       rgba(0,0,0,0.12);
  }

  /* ── POINT 16 / 20a: Dark mode overrides — contrast improved in Point 20a ── */
  [data-theme="dark"] {
    --bg:              #0e0e0f;
    --bg-card:         #18181b;
    --bg-chip:         #252528;
    --bg-chip-active:  #1e3b37;
    --bg-hover:        #2a2a2e;
    --border:          #3a3a40;
    --border-active:   #4a9e8e;
    --text:            #f0f0ec;
    --text-muted:      #c8c8c2;
    --text-faint:      #909088;
    --accent:          #4a9e8e;
    --accent-dark:     #5bbfad;
    --accent-text:     #7dd4c6;
    --correct:         #52d68e;
    --correct-bg:      #0d2b1f;
    --correct-border:  #2a7a50;
    --wrong:           #e87070;
    --wrong-bg:        #2b0d0d;
    --wrong-border:    #a03838;
    --shadow:          rgba(0,0,0,0.35);
    --shadow-md:       rgba(0,0,0,0.55);
  }

  /* ── POINT 21: rem base — inherits browser default, respects accessibility prefs ── */
  html { font-size: 100%; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 1rem;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-top: 132px; /* space for two-line sticky header + tabs */
    transition: background 0.2s, color 0.2s;
  }
  #app { width: 100%; max-width: 580px; margin: 0 auto; padding: 1.75rem 1rem 2rem; }

  /* ── POINT 19: Sticky header shell ── */
  #stickyShell {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    background: var(--bg); border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px var(--shadow);
  }
  #stickyInner { max-width: 580px; margin: 0 auto; padding: 0 1rem; }

  /* ── Header ── */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 0; gap: 0.5rem; }
  .header-left { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
  .site-logo { height: 2.25rem; width: 2.25rem; object-fit: contain; display: block; flex-shrink: 0; }
  [data-theme="dark"] .site-logo { filter: invert(1) brightness(1.8); }
  .title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.125rem; font-weight: 700; color: var(--text); letter-spacing: 0.01em; white-space: nowrap; flex: 1; min-width: 0; }
  .score-bar { display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0 0.4rem; }
  /* score-pill: min 44px tall for touch target */
  .score-pill { font-size: 0.8125rem; color: var(--text-muted); background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 0.25rem 0.625rem; min-height: 2.75rem; display: flex; align-items: center; }
  .score-pill span { font-weight: 600; color: var(--text); }

  /* ── Quiz / Dictionary toggle ── */
  .qd-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; margin-left: auto; flex-shrink: 0; }
  .qd-btn { padding: 0.25rem 0.75rem; font-size: 0.8125rem; font-weight: 500; border: none; background: transparent; color: var(--text-muted); cursor: pointer; transition: background 0.15s, color 0.15s; min-height: 2.75rem; white-space: nowrap; }
  .qd-btn.active { background: var(--bg-chip-active); color: var(--accent-text); }
  .qd-btn:hover:not(.active) { background: var(--bg-hover); color: var(--text); }

  /* ── POINT 16: Theme toggle button — 44px touch target ── */
  .theme-toggle {
    width: 2.75rem; height: 2.75rem; border-radius: 50%;
    background: var(--bg-chip); border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: var(--bg-hover); border-color: var(--border-active); }
  #themeToggleMobile { display: none; } /* hidden on desktop; shown in mobile block below */

  /* ── POINT 19: Mode tabs — live in sticky header ── */
  .mode-tabs { display: flex; border-top: 1px solid var(--border); }
  .mode-tab { flex: 1; padding: 0.625rem 0.25rem; font-size: 0.9375rem; font-weight: 500; border: none; background: transparent; color: var(--text-muted); cursor: pointer; transition: background 0.15s, color 0.15s, border-bottom 0.15s; border-bottom: 2px solid transparent; min-height: 2.75rem; }
  .mode-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: transparent; }
  .mode-tab:hover:not(.active) { background: var(--bg-hover); color: var(--text); }

  /* ── POINT 10: Training pool panel ── */
  .pool-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 1rem; overflow: hidden; }
  .pool-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; cursor: pointer; user-select: none; min-height: 2.75rem; }
  .pool-panel-header:hover { background: var(--bg-hover); }
  .pool-panel-title { font-size: 0.875rem; font-weight: 600; color: var(--text); }
  .pool-panel-meta { font-size: 0.75rem; color: var(--text-faint); }
  .pool-panel-arrow { font-size: 0.75rem; color: var(--text-faint); margin-left: 6px; }
  .pool-panel-body { border-top: 1px solid var(--border); padding: 0.75rem 1rem; display: none; }
  .pool-panel-body.open { display: block; }
  .pool-section { margin-bottom: 0.9rem; }
  .pool-section:last-child { margin-bottom: 0; }
  .pool-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; cursor: pointer; user-select: none; }
  .pool-section-header:hover .pool-section-title { color: var(--text); }
  .pool-section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 5px; transition: color 0.15s; }
  .pool-section-chevron { font-size: 0.65rem; color: var(--text-faint); transition: transform 0.2s; display: inline-block; }
  .pool-section-count { font-size: 0.75rem; color: var(--text-faint); }
  .pool-section-actions { display: flex; gap: 6px; }
  .pool-all-btn { font-size: 0.75rem; color: var(--accent-dark); background: none; border: none; cursor: pointer; padding: 0; min-height: 2.75rem; }
  .pool-all-btn:hover { text-decoration: underline; }
  .pool-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .pool-section-body { overflow: hidden; }
  .pool-section-body.collapsed { display: none; }
  /* pool-chip: min 44px tall */
  .pool-chip { font-size: 0.875rem; padding: 0.5rem 0.75rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .pool-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .pool-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }
  .pool-inv-row { display: flex; align-items: center; gap: 8px; margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--text-muted); }
  .pool-inv-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 2.75rem; }

  /* ── Chord playback style selector (POINT 6) ── */
  .chord-style-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .chord-style-chip { font-size: 0.875rem; padding: 0.5rem 0.875rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .chord-style-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .chord-style-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }

  /* ── POINT 23: Voicing mode chips (chord mode only) ── */
  .voicing-mode-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .voicing-chip { font-size: 0.875rem; padding: 0.5rem 0.875rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .voicing-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .voicing-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }

  /* ── Interval playback style selector (POINT 5) ── */
  .interval-style-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .style-chip { font-size: 0.875rem; padding: 0.5rem 0.875rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .style-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .style-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }

  /* ── Scale direction chips (POINT 7) ── */
  .scale-dir-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .scale-dir-chip { font-size: 0.875rem; padding: 0.5rem 0.875rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .scale-dir-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .scale-dir-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }

  /* ── Play area ── */
  .play-area { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .play-label { font-size: 0.75rem; color: var(--text-faint); margin-bottom: 1rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
  /* ── POINT 19: Enlarged play button with teal glow ── */
  .play-btn {
    width: 5rem; height: 5rem; border-radius: 50%;
    background: var(--accent); border: none;
    cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; font-size: 2rem;
    transition: transform 0.1s, background 0.15s, box-shadow 0.2s;
    color: #fff;
    box-shadow: 0 0 0 0 rgba(74,158,142,0);
  }
  .play-btn:hover:not(:disabled) { background: var(--accent-dark); box-shadow: 0 0 0 8px rgba(74,158,142,0.18), 0 4px 16px rgba(74,158,142,0.3); }
  .play-btn:active:not(:disabled) { transform: scale(0.93); }
  .play-btn.playing { background: var(--accent-dark); box-shadow: 0 0 0 10px rgba(74,158,142,0.22), 0 4px 20px rgba(74,158,142,0.35); }
  .play-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  .chord-hint { margin-top: 0.75rem; font-size: 0.875rem; color: var(--text-faint); min-height: 1.25rem; }

  /* ── Notation — always paper-white so VexFlow black ink is readable ── */
  /* POINT 20c: notation card fixed to #fff in both themes; VexFlow renders black ink */
  .notation-area {
    background: #ffffff; border: 1px solid var(--border); border-radius: 14px;
    padding: 1rem 1.5rem 0.5rem; margin-bottom: 1rem;
    text-align: center; display: none;
  }
  .notation-scroll {
    overflow-x: auto; overflow-y: visible;
    width: 100%; -webkit-overflow-scrolling: touch;
  }
  #notation-svg        { display: block; margin: 0 auto; max-width: none; }
  /* Labels inside notation card are always dark (card is always white) */
  .notation-label      { font-size: 0.75rem; color: #777; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; margin-bottom: 4px; }
  .notation-chord-name { font-size: 1.125rem; font-weight: 600; color: #1a1a18; margin-bottom: 4px; }

  /* ── Key sig chip — always light since notation card is always #fff ── */
  .keysig-chip-row { display: flex; justify-content: center; gap: 0.375rem; margin: 0.25rem 0 0.5rem; }
  .keysig-chip {
    font-size: 0.75rem; font-weight: 500; padding: 0.2rem 0.65rem;
    border-radius: 20px; border: 1px solid #d0d0cc;
    background: #f2f2f0; color: #666660;
    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
    min-height: 1.75rem; display: inline-flex; align-items: center;
  }
  .keysig-chip:hover:not(.active) { background: #e6e6e2; color: #1a1a18; }
  .keysig-chip.active {
    background: #e6f4f1; color: #1d5248;
    border-color: #4a9e8e; font-weight: 600;
  }

  /* ── Quiz status ── */
  .status-msg { font-size: 0.875rem; color: var(--text-muted); text-align: center; min-height: 1.375rem; margin-bottom: 0.75rem; }
  .status-msg.good { color: var(--correct); font-weight: 500; }
  .status-msg.bad  { color: var(--wrong);   font-weight: 500; }

  /* ── POINT 11: Custom answer dropdown ── */
  .answer-dropdown-wrap { position: relative; margin-bottom: 1rem; }
  .ans-dropdown-trigger {
    width: 100%; padding: 0.75rem 2.25rem 0.75rem 0.875rem; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px; font-size: 1rem;
    color: var(--text-muted); cursor: pointer; text-align: left; position: relative;
    transition: border-color 0.15s; user-select: none; min-height: 2.75rem;
  }
  .ans-dropdown-trigger::after {
    content: '▾'; position: absolute; right: 0.8125rem; top: 50%;
    transform: translateY(-50%); font-size: 0.75rem; color: var(--text-faint);
  }
  .ans-dropdown-trigger:hover:not(.disabled) { border-color: var(--text-faint); }
  .ans-dropdown-trigger.open { border-color: var(--accent); border-radius: 10px 10px 0 0; }
  .ans-dropdown-trigger.disabled { cursor: default; }
  .ans-dropdown-trigger.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); font-weight: 500; }
  .ans-dropdown-trigger.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border);   color: var(--wrong);   font-weight: 500; }

  .ans-dropdown-list {
    display: none; position: absolute; left: 0; right: 0; top: 100%;
    background: var(--bg-card); border: 1px solid var(--accent); border-top: none;
    border-radius: 0 0 10px 10px; max-height: 17.5rem; overflow-y: auto;
    z-index: 100; box-shadow: 0 6px 18px var(--shadow-md);
  }
  .ans-dropdown-list.open { display: block; }
  /* dropdown items: 44px min touch target */
  .ans-dropdown-item {
    padding: 0.75rem 0.875rem; font-size: 1rem; color: var(--text); cursor: pointer;
    border-bottom: 1px solid var(--border); transition: background 0.1s;
    min-height: 2.75rem; display: flex; align-items: center;
  }
  .ans-dropdown-item:last-child { border-bottom: none; }
  .ans-dropdown-item:hover { background: var(--bg-hover); }
  .ans-dropdown-item.correct { background: var(--correct-bg); color: var(--correct); font-weight: 500; }
  .ans-dropdown-item.wrong   { background: var(--wrong-bg);   color: var(--wrong); }

  /* ── Controls ── */
  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ctrl-btn { padding: 0.625rem 1.375rem; background: var(--bg-chip); border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; color: var(--text); cursor: pointer; transition: background 0.1s, border-color 0.15s; min-height: 2.75rem; }
  .ctrl-btn:hover { background: var(--bg-hover); border-color: var(--text-faint); }
  .ctrl-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ctrl-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .ctrl-btn.slow { background: var(--bg-chip); border-color: var(--border); color: var(--text-muted); }
  .ctrl-btn.slow:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text); }

  /* ── POINT 19: Collapsible Settings panel ── */
  .settings-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 1rem; overflow: hidden; }
  .settings-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; cursor: pointer; user-select: none; min-height: 2.75rem; }
  .settings-panel-header:hover { background: var(--bg-hover); }
  .settings-panel-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .settings-panel-arrow { font-size: 0.6875rem; color: var(--text-faint); }
  .settings-panel-body { border-top: 1px solid var(--border); padding: 0.75rem 1rem; display: none; }
  .settings-panel-body.open { display: block; }
  .settings-section { margin-bottom: 0.75rem; }
  .settings-section:last-child { margin-bottom: 0; }
  .settings-section-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
  .settings-chips { display: flex; gap: 5px; flex-wrap: wrap; }

  /* ── POINT 12: Root note & octave register chips ── */
  .register-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.4rem; }
  .register-row:last-child { margin-bottom: 0; }
  .register-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; min-width: 52px; }
  .register-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  /* reg-chip: min 44px tall */
  .reg-chip { font-size: 0.75rem; padding: 0.375rem 0.5625rem; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-chip); color: var(--text-muted); cursor: pointer; transition: all 0.15s; min-height: 2.75rem; display: inline-flex; align-items: center; }
  .reg-chip.active { background: var(--bg-chip-active); border-color: var(--border-active); color: var(--accent-text); font-weight: 500; }
  .reg-chip:hover:not(.active) { border-color: var(--text-faint); color: var(--text); }

  /* ── POINT 14: Post-answer breakdown panel ── */
  .breakdown-panel {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1rem 1.25rem; margin-bottom: 1rem; font-size: 1rem;
  }
  .breakdown-header {
    font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.75rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
  }
  .breakdown-figured { font-size: 0.6875rem; vertical-align: super; font-weight: 400; color: var(--text-faint); margin-left: 1px; }
  .breakdown-row { display: flex; gap: 0.5rem; margin-bottom: 0.35rem; align-items: baseline; }
  .breakdown-row:last-child { margin-bottom: 0; }
  .breakdown-key { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; flex-shrink: 0; }
  .breakdown-val { color: var(--text); line-height: 1.4; }
  .breakdown-sep { color: var(--text-faint); margin: 0 3px; }

  /* ── POINT 22: Breakdown enrichment styles ── */
  /* Sub-section divider inside breakdown panel */
  .breakdown-divider {
    border: none; border-top: 1px solid var(--border);
    margin: 0.6rem 0 0.5rem;
  }
  /* Relation pills row (Riemannian, tritone sub, etc.) */
  .breakdown-pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .breakdown-pill {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    background: var(--bg-chip); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.25rem 0.5rem;
    font-size: 0.8125rem; line-height: 1.3;
    cursor: default;
    position: relative;
  }
  .breakdown-pill-label {
    font-size: 0.625rem; font-weight: 700; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .breakdown-pill-value { font-weight: 600; color: var(--text); }
  /* Riemannian tooltip — shown on hover/focus */
  .bd-riemann-wrap { position: relative; display: inline-block; }
  .bd-riemann-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.125rem; height: 1.125rem; border-radius: 50%;
    background: var(--bg-chip); border: 1px solid var(--border);
    color: var(--text-faint); font-size: 0.625rem; font-weight: 700;
    cursor: help; margin-left: 5px; vertical-align: middle;
    flex-shrink: 0;
  }
  .bd-riemann-tooltip {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 0;
    width: 260px; background: var(--bg-card);
    border: 1px solid var(--border-active); border-radius: 10px;
    padding: 0.6rem 0.75rem; box-shadow: 0 4px 16px var(--shadow-md);
    z-index: 300; font-size: 0.75rem; color: var(--text-muted); line-height: 1.5;
  }
  .bd-riemann-tooltip strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .bd-riemann-tooltip p { margin: 0 0 0.35rem; }
  .bd-riemann-tooltip p:last-child { margin: 0; }
  .bd-riemann-wrap:hover .bd-riemann-tooltip,
  .bd-riemann-wrap:focus-within .bd-riemann-tooltip { display: block; }
  /* On very narrow screens push tooltip right so it doesn't clip */
  @media (max-width: 479px) {
    .bd-riemann-tooltip { left: auto; right: 0; width: 220px; }
  }

  /* ── POINT 36: Chord scales collapsible sub-section ── */
  .cs-section { margin-top: 0.5rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .cs-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.35rem 0.625rem; cursor: pointer; user-select: none;
    background: var(--bg-chip); font-size: 0.75rem; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    min-height: 2.25rem;
  }
  .cs-header:hover { background: var(--bg-hover); }
  .cs-arrow { font-size: 0.625rem; color: var(--text-faint); margin-left: 4px; }
  .cs-body { display: none; padding: 0.5rem 0.625rem 0.4rem; border-top: 1px solid var(--border); }
  .cs-body.open { display: block; }
  .cs-row { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.2rem 0; }
  .cs-name { font-size: 0.875rem; color: var(--text); flex: 1; }
  .cs-tag {
    font-size: 0.6875rem; font-weight: 600; padding: 0.1rem 0.4rem;
    border-radius: 20px; background: var(--bg-chip-active);
    color: var(--accent-text); border: 1px solid var(--border-active);
    white-space: nowrap; flex-shrink: 0;
  }
  .cs-note { font-size: 0.75rem; color: var(--text-faint); flex-shrink: 0; }

  /* ── POINT 8: Root toggle ── */
  .root-toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; font-size: 0.875rem; color: var(--text-muted); }
  .root-toggle-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; min-height: 2.75rem; }
  .root-badge { display: inline-block; background: var(--bg-chip-active); border: 1px solid var(--border-active); color: var(--accent-text); border-radius: 6px; padding: 2px 10px; font-size: 0.875rem; font-weight: 600; margin-left: 4px; }

  /* ── POINT 8: Stats panel ── */
  .stats-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 1rem; display: none; }
  .stats-title { font-size: 0.75rem; color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center; }
  .stats-title button { font-size: 0.75rem; color: var(--text-faint); background: none; border: none; cursor: pointer; padding: 0; min-height: 2.75rem; }
  .stats-title button:hover { color: var(--text-muted); }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  .stats-table th { text-align: left; color: var(--text-faint); font-weight: 500; padding: 2px 4px 4px; border-bottom: 1px solid var(--border); }
  .stats-table th:not(:first-child) { text-align: right; }
  .stats-table td { padding: 4px 4px; border-bottom: 1px solid var(--border); color: var(--text-muted); }
  .stats-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .stats-table tr:last-child td { border-bottom: none; }
  .stat-bar-wrap { display: inline-block; width: 60px; height: 6px; background: var(--border); border-radius: 3px; vertical-align: middle; margin-left: 4px; }
  .stat-bar { height: 6px; border-radius: 3px; background: var(--accent); }
  .stats-toggle { font-size: 0.75rem; color: var(--text-faint); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 0.75rem; display: block; min-height: 2.75rem; }
  .stats-toggle:hover { color: var(--text-muted); }

  /* ── POINT 8: Keyboard hint ── */
  .kbd-hint { font-size: 0.75rem; color: var(--text-faint); text-align: center; margin-top: 0.5rem; letter-spacing: 0.02em; }

  /* ── POINT 37: Voice leading ── */
  .vl-table { width: 100%; border-collapse: collapse; margin-top: 0.25rem; font-size: 0.8125rem; }
  .vl-table td { padding: 0.18rem 0.35rem; color: var(--text); }
  .vl-table td:first-child { font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .vl-table td:nth-child(2) { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .vl-table td:nth-child(3) { color: var(--text-faint); font-size: 0.75rem; white-space: nowrap; }
  .vl-table td:nth-child(4) { color: var(--text-faint); font-size: 0.75rem; font-style: italic; }
  .vl-table tr:hover td { background: var(--bg-hover); }
  .ctrl-btn.resolve {
    background: var(--bg-chip); border: 1px solid var(--border-active);
    color: var(--accent-text); font-weight: 600;
  }
  .ctrl-btn.resolve:hover { background: var(--bg-chip-active); }

  /* ── POINT 20.5: New Session button — 44px touch target ── */
  .new-session-btn {
    font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
    background: var(--bg-chip); border: 1px solid var(--border);
    border-radius: 20px; padding: 0.25rem 0.625rem; cursor: pointer;
    letter-spacing: 0.03em; transition: all 0.15s; white-space: nowrap;
    min-height: 2.75rem; display: inline-flex; align-items: center;
  }
  .new-session-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-chip-active); }

  /* ── MOBILE: phones up to 600px ── */
  @media (max-width: 600px) {

    /* ── 1. Fix body top padding to match slimmer header ── */
    body { padding-top: 96px; }

    /* ── 2. Header: single compact row — logo + full title (toggle moved to score bar) ── */
    #stickyInner { padding: 0 0.625rem; }
    .header { padding: 0.35rem 0; gap: 0.5rem; flex-wrap: nowrap; }
    .site-logo { height: 1.625rem; width: 1.625rem; flex-shrink: 0; }
    .title { font-size: 0.875rem; white-space: nowrap; overflow: visible; }
    #themeToggle { display: none; }           /* hide header toggle on mobile */
    #themeToggleMobile {                       /* show score-bar toggle on mobile */
      display: inline-flex;
      width: 2rem; height: 2rem; font-size: 0.875rem;
      flex-shrink: 0;
    }

    /* ── 3. Score bar: Streak + Score + New Session on one line; Quiz/Dict below ── */
    .score-bar { flex-wrap: wrap; gap: 0.375rem; padding: 0.15rem 0 0.25rem; }
    .score-pill { font-size: 0.7rem; padding: 0.15rem 0.4rem; min-height: 2rem; }
    .new-session-btn { font-size: 0.7rem; padding: 0.15rem 0.4rem; min-height: 2rem; }
    /* Quiz/Dict toggle: push to its own row by taking full width */
    .qd-toggle { margin-left: 0; width: 100%; border-radius: 10px; }
    .qd-btn { flex: 1; font-size: 0.75rem; padding: 0.2rem 0.5rem; min-height: 2rem; text-align: center; }

    /* ── 4. Mode tabs: tighter ── */
    .mode-tab { font-size: 0.8125rem; padding: 0.45rem 0.25rem; min-height: 2.5rem; }

    /* ── 5. App padding ── */
    #app { padding: 0.875rem 0.75rem 1rem; }

    /* ── 6. Root note chips: wrap grid so all chips are visible ── */
    #rootChips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    #rootChips .reg-chip {
      font-size: 0.75rem;
      padding: 0.3rem 0.5rem;
      min-height: 2.25rem;
    }
    /* Extra breathing room between sticky header and root panel */
    #rootPanel { margin-top: 1.25rem; }

    /* ── 7. Pool & Settings panels: collapsed by default on mobile ── */
    #poolPanel .pool-panel-body,
    #rootPanel .pool-panel-body,
    #settingsPanelBody { display: none; }
    /* Override: allow JS-toggled .open to show panels (ID specificity fix) */
    #poolPanel .pool-panel-body.open,
    #rootPanel .pool-panel-body.open { display: block; }

    /* ── 8. Play area: compact, no wasted space ── */
    .play-area { padding: 1rem; }
    .play-btn { width: 4.25rem; height: 4.25rem; font-size: 1.625rem; }

    /* ── 10. Dropdown: taller on mobile ── */
    .ans-dropdown-list { max-height: 52vh; }

    /* ── 11. Controls: full-width buttons ── */
    .ctrl-btn { flex: 1; min-width: 0; text-align: center; }

    /* ── 12. Breakdown: narrower key label ── */
    .breakdown-key { min-width: 68px; }

    /* ── 13. Tooltip: don't clip off right edge ── */
    .bd-riemann-tooltip { left: auto; right: 0; width: 210px; }

    /* ── 14. Notation card: tighter padding ── */
    .notation-area { padding: 0.75rem 0.75rem 0.375rem; }

    /* ── 15. Keyboard hint: hide on mobile (Space/Enter less relevant) ── */
    .kbd-hint { display: none; }
  }
</style>

<script>
// ─── Data ─────────────────────────────────────────────────────────────────────

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// ─── POINT 13: Enharmonic spelling engine (interval-based rewrite) ───────────
//
// The fundamental rule: the INTERVAL from the root determines the letter name.
// A major 3rd above D# must be F## — not G — because it is the 3rd degree.
// A diminished 7th above B must be Ab — not G# — because it is the 7th degree.
// When a double sharp (##) or double flat (bb) results, we append the enharmonic
// equivalent in parentheses, e.g. "F## (G)", so students see both the theoretically
// correct spelling and the practical reading pitch.
//
// Architecture:
//   spelledNote(intervalSemitones, rootPc)
//     → returns display string, e.g. "F##\u00a0(G)" or "B♭" or "E"
//   midiToVexKeySpelled(midi, intervalSemitones, rootPc)
//     → returns VexFlow key string, e.g. "fbb/4" or "g##/3"
//   vexAccidental(vexKey)
//     → returns VexFlow accidental token or null
//
// The old spelledNote(pitchClass, symbol, rootPc) API is replaced everywhere
// by spelledNote(intervalSemitones, rootPc). All call sites updated below.

// The 7 letter names in chromatic order from C (pitch class 0)
// Letter index: C=0, D=1, E=2, F=3, G=4, A=5, B=6
const LETTER_PCS = [0, 2, 4, 5, 7, 9, 11]; // pitch class of each natural letter (C D E F G A B)
const LETTER_NAMES = ['C','D','E','F','G','A','B'];

// Interval number → letter steps above root (0-based, mod 7)
// Unison=0, 2nd=1, 3rd=2, 4th=3, 5th=4, 6th=5, 7th=6, 8th/9th/etc wrap
// We derive letter steps from the interval semitone count using standard diatonic mapping.
// semitones → diatonic interval number (0-based letter steps):
// 0=unison(0), 1=m2(1), 2=M2(1), 3=m3(2), 4=M3(2), 5=P4(3), 6=A4/d5(3or4),
// 7=P5(4), 8=m6(5), 9=M6(5), 10=m7(6), 11=M7(6), 12=P8(0+octave)
// Extended: 13=m9(1+oct), 14=M9(1+oct), 17=P11(3+oct), 18=A11(3+oct), 20=m13(5+oct), 21=M13(5+oct)
//
// We use the interval's "generic" size (2nd, 3rd, 4th…) to pick the letter,
// then compute the accidental from the difference between that letter's natural
// pitch class and the actual target pitch class.

const SEMITONES_TO_LETTER_STEPS = {
  0: 0,   // unison / P8 / P15
  1: 1,   // m2 / A1
  2: 1,   // M2
  3: 2,   // m3
  4: 2,   // M3
  5: 3,   // P4
  6: 3,   // A4 (default; d5 = 4 handled by context — see below)
  7: 4,   // P5
  8: 5,   // m6
  9: 5,   // M6
  10: 6,  // m7
  11: 6,  // M7
};

// For tritone (6 semitones): context determines A4 vs d5.
// We expose a separate lookup for chord/scale symbols that use d5.
// Everything else defaults to A4 (augmented 4th = letter steps 3).
// Symbols that spell the tritone as a diminished 5th (letter steps 4):
const TRITONE_AS_D5 = new Set([
  'dim','m7b5','o7',           // diminished family — d5 in the chord
  'nat_minor','harm_minor','mel_minor', // minor scales — b5 degree is d5 context
  'locrian','phrygian','altered',       // modes with b5
]);

// Per-symbol: does the tritone interval (6 semitones) spell as d5 (letter steps 4)?
function tritoneIsDim5(symbol) {
  return TRITONE_AS_D5.has(symbol);
}

// For 8 semitones: context determines m6 (letter steps 5) vs A5 (letter steps 4).
// Default is m6. Symbols where 8 semitones IS an augmented 5th:
const EIGHT_AS_A5 = new Set([
  'aug', 'Maj7_s5',   // augmented chord family — the fifth IS augmented
  '7_s5',             // dominant 7 sharp 5
  'whole_tone',       // whole-tone scale: C D E F# G# A# — 8 semitones = G# = A5
]);

// For 9 semitones: context determines M6 (letter steps 5) vs d7 (letter steps 6).
// Default is M6. Symbols where 9 semitones IS a diminished 7th:
const NINE_AS_D7 = new Set([
  'o7',               // fully diminished 7th chord — the 7th IS diminished
]);

// Compute the spelled note name for a note that is `intervalSemitones` above rootPc.
// Returns a display string. Double accidentals get parenthetical enharmonic.
// intervalSemitones: the raw semitone distance (can be > 12 for extensions)
// rootPc: pitch class of the root (0–11)
// symbol: chord/scale/interval symbol (for tritone context only)
function spelledNote(intervalSemitones, rootPc, symbol) {
  const semitones = ((intervalSemitones % 12) + 12) % 12; // normalise to 0–11
  const rootPcN   = ((rootPc % 12) + 12) % 12;

  // Letter steps above root
  let letterSteps;
  if (semitones === 6) {
    letterSteps = tritoneIsDim5(symbol) ? 4 : 3;      // A4 vs d5
  } else if (semitones === 8 && EIGHT_AS_A5.has(symbol)) {
    letterSteps = 4;                                    // augmented 5th (not minor 6th)
  } else if (semitones === 9 && NINE_AS_D7.has(symbol)) {
    letterSteps = 6;                                    // diminished 7th (not major 6th)
  } else {
    letterSteps = SEMITONES_TO_LETTER_STEPS[semitones];
  }

  // Root letter index (0=C … 6=B)
  const rootLetterIdx = LETTER_PCS.findIndex(pc => pc === rootPcN);
  // If root is not a natural note (e.g. root is C# = pc 1), find the correct letter
  // by consulting the user's spelling preference (pinnedRootSpelling), or falling back
  // to conventional key-signature rules when no root is pinned (Rnd mode).
  const rootLetterIdxResolved = (() => {
    if (rootLetterIdx !== -1) return rootLetterIdx; // natural root — no ambiguity
    // flat map:  pc 1→D(1), 3→E(2), 6→G(4), 8→A(5), 10→B(6)
    // sharp map: pc 1→C(0), 3→D(1), 6→F(3), 8→G(4), 10→A(5)
    const flatMap  = {1:1, 3:2, 6:4, 8:5, 10:6};
    const sharpMap = {1:0, 3:1, 6:3, 8:4, 10:5};
    if (pinnedRootSpelling === 'flat')  return flatMap[rootPcN]  ?? 0;
    if (pinnedRootSpelling === 'sharp') return sharpMap[rootPcN] ?? 0;
    // Auto: conventional key-signature preference (Db Eb Gb Ab Bb = flat)
    const FLAT_ROOT_PCS = new Set([1,3,6,8,10]);
    return FLAT_ROOT_PCS.has(rootPcN) ? (flatMap[rootPcN] ?? 0) : (sharpMap[rootPcN] ?? 0);
  })();

  // Target letter index (mod 7)
  const targetLetterIdx = (rootLetterIdxResolved + letterSteps) % 7;
  const targetLetterName = LETTER_NAMES[targetLetterIdx];

  // Natural pitch class of the target letter
  const naturalPc = LETTER_PCS[targetLetterIdx];

  // Actual target pitch class
  const targetPc = (rootPcN + semitones) % 12;

  // Difference: how many semitones to adjust from the natural letter
  // We take the shortest path in range –2…+2 (double flat to double sharp)
  let diff = targetPc - naturalPc;
  // Wrap into –6…+6 to handle crossing the octave boundary
  if (diff > 6)  diff -= 12;
  if (diff < -6) diff += 12;

  // Build accidental string
  const ACC = ['𝄫','♭♭','♭','','♯','♯♯','𝄪'];
  //           diff: -3   -2   -1   0   +1   +2   +3  (we only support –2…+2)
  const accIndex = diff + 3; // shift so diff=0 → index 3
  const accStr = (diff >= -2 && diff <= 2) ? ACC[accIndex] : '?';

  const displayName = targetLetterName + accStr;

  // Enharmonic equivalent in parentheses for double accidentals
  let enharmonicStr = '';
  if (diff === 2 || diff === -2) {
    // Double sharp or double flat — show enharmonic equivalent
    const enh = SHARP_NAMES_BASIC[targetPc] ?? FLAT_NAMES_BASIC[targetPc];
    enharmonicStr = '\u00a0(' + enh + ')'; // non-breaking space before paren
  }

  return displayName + enharmonicStr;
}

// Simple sharp/flat name arrays for enharmonic parentheticals only
// (used only when a double accidental occurs)
const SHARP_NAMES_BASIC = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT_NAMES_BASIC  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

// Convenience: spell the ROOT note itself (interval = 0 from itself)
// rootPc: pitch class. Respects pinnedRootSpelling when set; otherwise uses
// conventional key-signature preference (flat keys: Db Eb Gb Ab Bb).
function spelledRoot(rootPc) {
  const pc = ((rootPc % 12) + 12) % 12;
  if (pinnedRootSpelling === 'flat')  return FLAT_NAMES_BASIC[pc];
  if (pinnedRootSpelling === 'sharp') return SHARP_NAMES_BASIC[pc];
  // Auto: conventional key-signature preference
  const FLAT_ROOT_PCS = new Set([1,3,6,8,10]);
  return FLAT_ROOT_PCS.has(pc) ? FLAT_NAMES_BASIC[pc] : SHARP_NAMES_BASIC[pc];
}

// Context-aware VexFlow key string (e.g. "fbb/4", "g##/3", "bb/3")
// midi: MIDI note number
// intervalSemitones: semitone distance from root to this note
// rootPc: root pitch class
// symbol: chord/scale symbol (for tritone context)
function midiToVexKeySpelled(midi, intervalSemitones, rootPc, symbol) {
  let oct = Math.floor(midi / 12) - 1;
  // Get the display name (without enharmonic parenthetical)
  const full = spelledNote(intervalSemitones, rootPc, symbol);
  const base = full.split('\u00a0')[0]; // strip parenthetical if present

  // Extract letter and accidental for VexFlow
  const letter = base[0].toLowerCase();
  const acc    = base.slice(1); // e.g. '♯♯', '♭', '', '♯'

  // Map unicode accidentals to VexFlow suffixes
  const VEX_ACC = {
    '': '', '♯': '#', '♭': 'b', '♯♯': '##', '♭♭': 'bb',
    '𝄪': '##', '𝄫': 'bb',
  };
  const vexAcc = VEX_ACC[acc] ?? '';

  // Fix octave boundary: the spelled letter may cross the C/B octave line
  // relative to the raw MIDI pitch class.
  // e.g. Cb (letter C) sounds like B — MIDI puts it in oct N but the letter C
  // belongs one octave higher visually, so decrement oct.
  // e.g. B## (letter B) sounds like C# — MIDI puts it in oct N but the letter B
  // belongs one octave lower visually, so increment oct.
  const midiPc = midi % 12;
  if (letter === 'c' && midiPc >= 9) oct += 1;  // Cb/Cbb: sounds like B-range, letter is C
  if (letter === 'b' && midiPc <= 2) oct -= 1;  // B##/B#: sounds like C-range, letter is B

  return letter + vexAcc + '/' + oct;
}

// Accidental token for VexFlow StaveNote from a vex key string
function vexAccidental(vexKey) {
  const n = vexKey.split('/')[0];
  if (n.endsWith('##')) return '##';
  if (n.endsWith('bb') && n.length > 2) return 'bb';
  if (n.endsWith('#'))  return '#';
  if (n.endsWith('b') && n.length > 1) return 'b';
  return null;
}

// ─── Interval-semitone helpers for call sites ─────────────────────────────────
// All old spelledNote(pitchClass, symbol, rootPc) calls are replaced with
// spelledNote(intervalSemitones, rootPc, symbol) where intervalSemitones is
// computed as (targetPc - rootPc + 12) % 12 at each call site.
// Helper to compute semitone interval from rootPc to a pitch class:
function pcInterval(targetPc, rootPc) {
  return ((targetPc - rootPc) % 12 + 12) % 12;
}

// ─── Key signature helpers (scale mode) ───────────────────────────────────────

// Toggle the C / Key chip and re-render notation
function setKeySig(mode) {
  if (currentMode === 'scales')    scaleKeySigMode    = mode;
  else if (currentMode === 'chords')    chordKeySigMode    = mode;
  else if (currentMode === 'intervals') intervalKeySigMode = mode;
  document.getElementById('keysigChipC').classList.toggle('active', mode === 'C');
  document.getElementById('keysigChipKey').classList.toggle('active', mode === 'key');
  showNotation();
}

// VexFlow key signature strings for each pitch class + quality.
// Enharmonic pairs at pcs 1,3,6,8,10 — chosen by pinnedRootSpelling when set.
// Default (no pinned root): conventional preference (flat side for those 5 pcs).
const VEX_KEY_MAJOR_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const VEX_KEY_MAJOR_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const VEX_KEY_MINOR_FLAT  = ['Am','Bbm','Bm','Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m'];
const VEX_KEY_MINOR_SHARP = ['Am','A#m','Bm','Cm','C#m','Dm','D#m','Em','Fm','F#m','Gm','G#m'];

function vexKeyMajor(pc) {
  if (pinnedRootSpelling === 'sharp') return VEX_KEY_MAJOR_SHARP[pc];
  if (pinnedRootSpelling === 'flat')  return VEX_KEY_MAJOR_FLAT[pc];
  return VEX_KEY_MAJOR_FLAT[pc]; // conventional default = flat side
}
function vexKeyMinor(pc) {
  if (pinnedRootSpelling === 'sharp') return VEX_KEY_MINOR_SHARP[pc];
  if (pinnedRootSpelling === 'flat')  return VEX_KEY_MINOR_FLAT[pc];
  return VEX_KEY_MINOR_FLAT[pc]; // conventional default
}

function getScaleParentKeyStr(scale, rootPc) {
  if (!scale.parentKey) return null;
  const { offset, quality } = scale.parentKey;
  const parentPc = ((rootPc + offset) % 12 + 12) % 12;
  return quality === 'minor' ? vexKeyMinor(parentPc) : vexKeyMajor(parentPc);
}

// POINT 32b: Return a VexFlow key sig string implied by a chord symbol + root pitch class.
function getChordKeyStr(sym, rootPc) {
  const minorFamilies = ['m', 'm7', 'mM7', 'm6', 'm9', 'm11', 'm13', 'hdim', 'hdim7', 'dim', 'dim7'];
  const quality = minorFamilies.includes(sym) ? 'minor' : 'major';
  return quality === 'minor' ? vexKeyMinor(rootPc) : vexKeyMajor(rootPc);
}

// Best-fit key: find the major or minor key whose scale contains the most pitch classes
// from the given midi notes. Ties broken by fewest accidentals (proximity to C major).
// Used for polychords, UST, and slash chords where a single root key isn't obvious.
function getBestFitKeyStr(midiNotes) {
  const chordPcs = new Set(midiNotes.map(m => ((m % 12) + 12) % 12));
  const MAJOR_SCALE = [0,2,4,5,7,9,11];
  const MINOR_SCALE = [0,2,3,5,7,8,10];
  // Accidental counts per root pc for major and minor (used as tiebreaker — fewer = closer to C)
  const MAJOR_ACC = [0,5,2,3,4,1,6,1,4,3,2,5]; // C Db D Eb E F Gb G Ab A Bb B
  const MINOR_ACC = [0,4,2,3,1,3,2,1,4,3,2,5]; // Am Bbm Bm Cm C#m Dm D#m Em Fm F#m Gm G#m
  let bestKey = null, bestScore = -1, bestAcc = 99, bestMinor = false;
  for (let pc = 0; pc < 12; pc++) {
    for (const [scale, acc, isMinor] of [
      [MAJOR_SCALE, MAJOR_ACC[pc], false],
      [MINOR_SCALE, MINOR_ACC[pc], true],
    ]) {
      const scalePcs = new Set(scale.map(i => (i + pc) % 12));
      let score = 0;
      for (const cp of chordPcs) if (scalePcs.has(cp)) score++;
      if (score > bestScore || (score === bestScore && acc < bestAcc)) {
        bestScore = score; bestAcc = acc; bestKey = pc; bestMinor = isMinor;
      }
    }
  }
  return bestMinor ? vexKeyMinor(bestKey) : vexKeyMajor(bestKey);
}

// POINT 32b: Return a VexFlow key sig string for an interval, based on the lower note's pitch class.
function getIntervalKeyStr(rootPc) {
  return vexKeyMajor(rootPc);
}

// ── Key-signature coverage helpers ───────────────────────────────────────────
//
// A key signature covers specific LETTER+ACCIDENTAL combinations, not pitch
// classes. E.g. Db major covers Bb Eb Ab Db Gb — meaning the letter B with a
// flat, the letter E with a flat, etc. It does NOT cover D# even though D# and
// Eb share pitch class 3. We therefore track coverage as a Set of vex letter
// strings (e.g. 'bb', 'eb', 'ab', 'db', 'gb').

const MAJOR_SHARPS_COUNT = { C:0, G:1, D:2, A:3, E:4, B:5, 'F#':6, 'C#':7 };
const MAJOR_FLATS_COUNT  = { C:0, F:1, Bb:2, Eb:3, Ab:4, Db:5, Gb:6, Cb:7 };
const MINOR_TO_REL_MAJOR = {
  Am:'C', Bm:'D', Cm:'Eb', 'C#m':'E', Dm:'F', 'D#m':'F#', Em:'G',
  Fm:'Ab', 'F#m':'A', Gm:'Bb', 'G#m':'B', Bbm:'Db', Ebm:'Gb',
};

// Order of sharps/flats as letter names (no octave)
const SHARP_ORDER_LETTERS = ['f#','c#','g#','d#','a#','e#','b#'];
const FLAT_ORDER_LETTERS  = ['bb','eb','ab','db','gb','cb','fb'];

function _getMajorKey(vexKeyStr) {
  if (!vexKeyStr) return 'C';
  if (vexKeyStr.endsWith('m')) return MINOR_TO_REL_MAJOR[vexKeyStr] ?? 'C';
  return vexKeyStr;
}

// Returns a Set of vex letter strings covered by the key sig, e.g. {'bb','eb','ab','db','gb'}
function keySigCoveredLetters(vexKeyStr) {
  if (!vexKeyStr) return new Set();
  const majorKey = _getMajorKey(vexKeyStr);
  const covered = new Set();
  if (MAJOR_SHARPS_COUNT[majorKey] !== undefined) {
    const n = MAJOR_SHARPS_COUNT[majorKey];
    for (let i = 0; i < n; i++) covered.add(SHARP_ORDER_LETTERS[i]);
  } else if (MAJOR_FLATS_COUNT[majorKey] !== undefined) {
    const n = MAJOR_FLATS_COUNT[majorKey];
    for (let i = 0; i < n; i++) covered.add(FLAT_ORDER_LETTERS[i]);
  }
  return covered;
}

// Is this vex key string (e.g. 'eb/4', 'f#/5') covered by coveredLetters?
// We strip the octave and match the letter+acc part.
function isCoveredByKeySig(vexKey, coveredLetters) {
  const letterAcc = vexKey.split('/')[0]; // e.g. 'eb', 'f#', 'c'
  return coveredLetters.has(letterAcc);
}

// Re-spell a midi note enharmonically when the primary spelling is a double
// accidental AND the enharmonic alternative is covered (or simpler) in this key.
// Returns a new vex key string, or the original if no re-spell needed.
// This handles cases like Ebb → D when Eb is in the key sig (the Ebb would have
// been spelled from the interval engine but D is the correct practical reading).
function respellForKeySig(midi, vexKey, coveredLetters, keySigStr) {
  const letterAcc = vexKey.split('/')[0];
  const oct = vexKey.split('/')[1];

  // Only re-spell if current spelling has a double accidental
  const isDoubleSharp = letterAcc.endsWith('##');
  const isDoubleFlat  = letterAcc.endsWith('bb') && letterAcc.length > 2; // 'bb' alone = B-flat

  if (!isDoubleSharp && !isDoubleFlat) return vexKey; // single acc or natural — keep

  // Enharmonic pitch class
  const pc = midi % 12;

  // Try the two simpler enharmonic spellings (natural or single-acc) for this pc
  // and pick whichever fits the key sig (covered) or is a natural note
  const candidates = [];
  for (let li = 0; li < 7; li++) {
    const naturalPc = LETTER_PCS[li];
    const letter = LETTER_NAMES[li].toLowerCase();
    for (const [accSuffix, delta] of [['',0],['#',1],['b',-1]]) {
      const candidate_pc = ((naturalPc + delta) % 12 + 12) % 12;
      if (candidate_pc === pc) {
        const candidateKey = letter + accSuffix;
        // Adjust octave: handle C/B boundary
        let candOct = parseInt(oct);
        if (letter === 'c' && pc >= 9) candOct += 1;
        if (letter === 'b' && pc <= 2) candOct -= 1;
        candidates.push(candidateKey + '/' + candOct);
      }
    }
  }

  // Prefer: covered by key sig → natural → single sharp → single flat
  const covered = candidates.find(k => isCoveredByKeySig(k, coveredLetters));
  if (covered) return covered;
  const natural = candidates.find(k => !k.split('/')[0].match(/[#b]/));
  if (natural) return natural;
  return candidates[0] ?? vexKey; // fallback to first candidate or original
}

// Legacy pitch-class based function (kept for callers that still use it)
function keySigCoveredPcs(vexKeyStr) {
  if (!vexKeyStr) return new Set();
  const SHARP_ORDER_PCS = [6, 1, 8, 3, 10, 5, 0];
  const FLAT_ORDER_PCS  = [10, 3, 8, 1, 6, 11, 4];
  const majorKey = _getMajorKey(vexKeyStr);
  const covered = new Set();
  if (MAJOR_SHARPS_COUNT[majorKey] !== undefined) {
    const n = MAJOR_SHARPS_COUNT[majorKey];
    for (let i = 0; i < n; i++) covered.add(SHARP_ORDER_PCS[i]);
  } else if (MAJOR_FLATS_COUNT[majorKey] !== undefined) {
    const n = MAJOR_FLATS_COUNT[majorKey];
    for (let i = 0; i < n; i++) covered.add(FLAT_ORDER_PCS[i]);
  }
  return covered;
}

// Count how many accidentals a key sig has (for canvas width padding)
function keySigAccidentalCount(vexKeyStr) {
  if (!vexKeyStr) return 0;
  const majorKey = _getMajorKey(vexKeyStr);
  if (MAJOR_SHARPS_COUNT[majorKey] !== undefined) return MAJOR_SHARPS_COUNT[majorKey];
  if (MAJOR_FLATS_COUNT[majorKey]  !== undefined) return MAJOR_FLATS_COUNT[majorKey];
  return 0;
}

// POINT 9b: Six-family chord library — Berklee/Real Book professional symbols
// Each entry: { name, symbol, intervals, family }
// name   = display label shown to user (unicode ♭/♯)
// symbol = internal key (b/# ASCII, unique)
// family = groups chips in the pool panel
const CHORD_TYPES = {
  major: [
    { name: 'maj',              symbol: 'maj',           intervals: [0,4,7],             family: 'major' },
    { name: 'maj(9)',           symbol: 'maj_add9',      intervals: [0,4,7,14],          family: 'major' },
    { name: 'maj6',             symbol: 'maj6',          intervals: [0,4,7,9],           family: 'major' },
    { name: 'maj6(9)',          symbol: 'maj69',         intervals: [0,4,7,9,14],        family: 'major' },
    { name: 'Maj7',             symbol: 'Maj7',          intervals: [0,4,7,11],          family: 'major' },
    { name: 'Maj7(9)',          symbol: 'Maj7_9',        intervals: [0,4,7,11,14],       family: 'major' },
    { name: 'Maj7(\u266f11)',   symbol: 'Maj7_s11',      intervals: [0,4,7,11,18],       family: 'major' },
    { name: 'Maj7(13)',         symbol: 'Maj7_13',       intervals: [0,4,7,11,21],       family: 'major' },
    { name: 'Maj7(9)(\u266f11)',symbol: 'Maj7_9_s11',    intervals: [0,4,7,11,14,18],    family: 'major' },
    { name: 'Maj7(9)(13)',      symbol: 'Maj7_9_13',     intervals: [0,4,7,11,14,21],    family: 'major' },
    { name: 'Maj7(\u266f11)(13)',symbol:'Maj7_s11_13',   intervals: [0,4,7,11,18,21],    family: 'major' },
    { name: 'Maj7(9)(\u266f11)(13)',symbol:'Maj7_9_s11_13',intervals:[0,4,7,11,14,18,21],family: 'major' },
  ],
  minor: [
    { name: 'm',                symbol: 'm',             intervals: [0,3,7],             family: 'minor' },
    { name: 'm(9)',             symbol: 'm_add9',        intervals: [0,3,7,14],          family: 'minor' },
    { name: 'm6',               symbol: 'm6',            intervals: [0,3,7,9],           family: 'minor' },
    { name: 'm6(9)',            symbol: 'm69',           intervals: [0,3,7,9,14],        family: 'minor' },
    { name: 'm7',               symbol: 'm7',            intervals: [0,3,7,10],          family: 'minor' },

// ─── Helpers ──────────────────────────────────────────────────────────────────

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function midiToSoundFontName(midi) { return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1); }

// POINT 2: Inversion helpers
const INV_LABELS = ['', '1st inv', '2nd inv', '3rd inv', '4th inv'];

function applyInversion(baseIntervals, rootMidi, invIndex) {
  let notes = baseIntervals.map(i => rootMidi + i);
  for (let i = 0; i < invIndex; i++) {
    const lowest = notes.shift();
    notes.push(lowest + 12);
  }
  return notes;
}

function buildInversionPool(basePool) {
  const inv = [];
  basePool.forEach(chord => {
    const maxInv = chord.intervals.length - 1;
    for (let i = 1; i <= maxInv; i++) {
      inv.push({
        name: chord.name + ' \u2014 ' + INV_LABELS[i],
        symbol: chord.symbol + '_inv' + i,
        baseSymbol: chord.symbol,
        baseChord: chord,
        invIndex: i,
      });
    }
  });
  return inv;
}

// POINT 10 / 9b: Build chord pool from granular selection across all families
function getAllChords() {
  return [
    ...CHORD_TYPES.major,
    ...CHORD_TYPES.minor,
    ...CHORD_TYPES.dominant,
    ...CHORD_TYPES.diminished,
    ...CHORD_TYPES.augmented,
    ...CHORD_TYPES.suspended,
    ...CHORD_TYPES.slash, // POINT 25
    ...CHORD_TYPES.poly,  // POINT 26
    ...CHORD_TYPES.ust,   // POINT 26
  ];
}

function getActivePool() {
  let basePool = getAllChords().filter(c => selectedChords.has(c.symbol));
  if (!basePool.length) basePool = CHORD_TYPES.major.slice(0,1).concat(CHORD_TYPES.minor.slice(0,1), CHORD_TYPES.diminished.slice(0,1), CHORD_TYPES.augmented.slice(0,1)); // safety fallback
  let pool = [...basePool];
  // POINT 25/26: slash, poly, UST don't support inversions
  if (includeInversions) pool = pool.concat(buildInversionPool(basePool.filter(c => c.family !== 'slash' && c.family !== 'poly' && c.family !== 'ust')));
  return pool;
}

// POINT 10: Build interval pool from granular selection
function getActiveIntervalPool() {
  const pool = INTERVALS.filter(i => selectedIntervals.has(i.symbol));
  return pool.length ? pool : INTERVALS;
}

// POINT 10: Build scale pool from granular selection
function getActiveScalePool() {
  const pool = SCALES.filter(s => selectedScales.has(s.symbol));
  return pool.length ? pool : [SCALES[0]];
}

// POINT 12: Resolve octave band to [lo, hi] inclusive
function resolveOctaveBand(band, loDefault, hiDefault) {
  if (band === 'low')  return [2, 3];
  if (band === 'mid')  return [3, 4];
  if (band === 'high') return [4, 5];
  return [loDefault, hiDefault];
}

// POINT 3 / 12: Smart root picker for chords (respects pinnedRoot + pinnedOctave)
function chooseRootMidi(chord) {
  const intervals = chord.invIndex !== undefined ? chord.baseChord.intervals : chord.intervals;
  const span = intervals[intervals.length - 1];
  const pitchClass = pinnedRoot !== null ? pinnedRoot : Math.floor(Math.random() * 12);

  // Compute safe octave range for this chord's span
  const absMin = Math.ceil((28 - 12) / 12);
  const absMax = Math.floor((96 - 12 - span) / 12);
  const defaultLo = span > 14 ? Math.max(3, absMin) : Math.max(2, absMin);
  const defaultHi = Math.min(5, absMax);

  const [lo, hi] = resolveOctaveBand(pinnedOctave, defaultLo, defaultHi);
  const clampedLo = Math.max(lo, absMin);
  const clampedHi = Math.min(hi, absMax);
  const safeLo = Math.min(clampedLo, clampedHi);
  const safeHi = Math.max(clampedLo, clampedHi);

  const octave = safeLo + Math.floor(Math.random() * (safeHi - safeLo + 1));
  return 12 + pitchClass + octave * 12;
}

// POINT 12: Simple root picker for intervals and scales
function chooseSimpleRootMidi(semitoneRange) {
  // semitoneRange: how many semitones above root (e.g. 12 for octave, 0 for just root)
  const pitchClass = pinnedRoot !== null ? pinnedRoot : Math.floor(Math.random() * 12);
  const [lo, hi] = resolveOctaveBand(pinnedOctave, 3, 5);
  // clamp so top note stays below midi 97
  const clampedHi = Math.min(hi, Math.floor((96 - semitoneRange) / 12) - 1);
  const safeLo = Math.min(lo, clampedHi);
  const octave = safeLo + Math.floor(Math.random() * (clampedHi - safeLo + 1));
  return 12 + pitchClass + octave * 12;
}

function recordAnswer(symbol, name, isCorrect) {
  if (!sessionStats[symbol]) sessionStats[symbol] = { name, correct: 0, total: 0 };
  sessionStats[symbol].total++;
  if (isCorrect) sessionStats[symbol].correct++;
  renderStats();
}

function renderStats() {
  const tbody = document.getElementById('statsBody');
  const entries = Object.values(sessionStats).sort((a, b) => {
    const pA = a.total ? a.correct / a.total : 1;
    const pB = b.total ? b.correct / b.total : 1;
    return pA - pB; // worst first
  });
  tbody.innerHTML = '';
  entries.forEach(e => {
    const pct = e.total ? Math.round(e.correct / e.total * 100) : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.name}</td>
      <td>${e.correct}</td>
      <td>${e.total}</td>
      <td>${pct}%<span class="stat-bar-wrap"><span class="stat-bar" style="width:${pct}%"></span></span></td>`;
    tbody.appendChild(tr);
  });
}

// ─── POINT 23: Voicing modes ─────────────────────────────────────────────────

const VOICING_MODES = [
  { name: 'Full',  symbol: 'full',   desc: 'All notes as written' },
  { name: 'Real',  symbol: 'real',   desc: 'Omit P5 (unless altered)' },
  { name: 'Shell', symbol: 'shell',  desc: 'Root + 3rd + 7th only' },
  { name: 'Guide', symbol: 'guide',  desc: '3rd + 7th only (no root)' },
  { name: 'Rnd',   symbol: 'random', desc: 'Random voicing each question' },
];

// Given base intervals (semitones from root) and a voicing mode,
// return the filtered subset of interval indices to keep.
// "From root" / "Numerals" always show the full set — this only affects
// what actually sounds and what appears in Notes / Between notes.
function applyVoicingMode(baseIntervals, mode) {
  // Resolve random
  const resolved = mode === 'random'
    ? ['full','real','shell','guide'][Math.floor(Math.random() * 4)]
    : mode;

  // Identify interval roles by semitone value (mod 12)
  const roles = baseIntervals.map(i => {
    const s = i % 12;
    if (s === 0)  return 'root';
    if (s === 3 || s === 4)  return 'third';   // m3 or M3
    if (s === 7)  return 'fifth';              // P5
    if (s === 6 || s === 8)  return 'altfifth'; // b5 or #5 — keep always
    if (s === 10 || s === 11) return 'seventh'; // m7 or M7
    return 'extension'; // 9, 11, 13 etc.
  });

  const hasAltFifth = roles.includes('altfifth');

  let keep;
  if (resolved === 'real') {
    // Omit P5 unless it's altered (b5 / #5)
    keep = baseIntervals.filter((_, i) => roles[i] !== 'fifth');
  } else if (resolved === 'shell') {
    // Root + 3rd + 7th — drop 5th and extensions
    // If no 7th exists (triads), fall back to full
    const hasSeventh = roles.includes('seventh');
    if (!hasSeventh) {
      keep = [...baseIntervals];
    } else {
      keep = baseIntervals.filter((_, i) =>
        roles[i] === 'root' || roles[i] === 'third' || roles[i] === 'seventh'
      );
    }
  } else if (resolved === 'guide') {
    // 3rd + 7th only — no root, no 5th, no extensions
    // If no 7th (triads), fall back to full
    const hasSeventh = roles.includes('seventh');
    if (!hasSeventh) {
      keep = [...baseIntervals];
    } else {
      keep = baseIntervals.filter((_, i) =>
        roles[i] === 'third' || roles[i] === 'seventh'
      );
    }
  } else {
    // full: all notes
    keep = [...baseIntervals];
  }

  // Safety: never return empty
  return keep.length ? keep : [...baseIntervals];
}

// Resolve the current voicing mode for a question (stores resolved random)
let currentVoicingMode = 'full';    // resolved per-question
let currentChordPlayStyle = 'block'; // POINT 32: resolved at play time, read by showNotation

function resolveVoicingMode() {
  if (activeVoicingMode === 'random') {
    const opts = ['full','real','shell','guide'];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  return activeVoicingMode;
}

function renderVoicingChips() {
  const row = document.getElementById('voicingModeRow');

}

    })

    });

function setPlayingState(on) {
  const btn = document.getElementById('playBtn');
  btn.classList.toggle('playing', on);
  btn.textContent = on ? '\u266A' : '\u25B6';
}

// Play a list of midi notes with optional melodic delay between them
function playMidiNotes(midiNotes, style) {
  if (!piano) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setPlayingState(true);
  const now = audioCtx.currentTime;

  if (style === 'harmonic') {
    midiNotes.forEach(midi => {
      piano.play(midiToSoundFontName(midi), now, { duration: 2, gain: 1.4 });
    });
    setTimeout(() => setPlayingState(false), 2200);
  } else {
    // Melodic: ascending or descending
    const ordered = style === 'descending' ? [...midiNotes].reverse() : [...midiNotes];
    const gap = 0.55; // seconds between notes
    ordered.forEach((midi, i) => {
      piano.play(midiToSoundFontName(midi), now + i * gap, { duration: gap * 1.6, gain: 1.4 });
    });
    setTimeout(() => setPlayingState(false), (ordered.length * gap + 1.2) * 1000);
  }
}

// POINT 6: Chord playback with all modes
function resolveChordStyle() {
  if (chordPlayStyle === 'random') {
    const opts = ['block', 'ascending', 'descending', 'broken'];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  return chordPlayStyle;
}

function playChord() {
  if (!piano) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setPlayingState(true);
  const now = audioCtx.currentTime;

  currentChordPlayStyle = resolveChordStyle(); // POINT 32: store so showNotation mirrors playback
  const style = currentChordPlayStyle;
  // POINT 25: merge bass note for slash; POINT 26: poly/UST already have all notes in currentMidiNotes
  const allNotes = currentChord?.family === 'slash' && currentSlashBassMidi !== null
    ? [currentSlashBassMidi, ...currentMidiNotes]
    : [...currentMidiNotes];
  const notes = allNotes.sort((a, b) => a - b);

  if (style === 'block') {
    notes.forEach(midi => piano.play(midiToSoundFontName(midi), now, { duration: 2, gain: 1.4 }));
    setTimeout(() => setPlayingState(false), 2400);

  } else if (style === 'ascending') {
    const gap = 0.18;
    notes.forEach((midi, i) => piano.play(midiToSoundFontName(midi), now + i * gap, { duration: 2, gain: 1.4 }));
    setTimeout(() => setPlayingState(false), (notes.length * gap + 2) * 1000);

  } else if (style === 'descending') {
    const gap = 0.18;
    [...notes].reverse().forEach((midi, i) => piano.play(midiToSoundFontName(midi), now + i * gap, { duration: 2, gain: 1.4 }));
    setTimeout(() => setPlayingState(false), (notes.length * gap + 2) * 1000);

  } else if (style === 'broken') {
    // Root – top – 2nd – top pattern (classical broken chord feel)
    const root = notes[0];
    const top  = notes[notes.length - 1];
    const mid  = notes.length > 2 ? notes[1] : notes[0];
    const pattern = [root, top, mid, top];
    const gap = 0.28;
    pattern.forEach((midi, i) => piano.play(midiToSoundFontName(midi), now + i * gap, { duration: gap * 2.2, gain: 1.4 }));
    setTimeout(() => setPlayingState(false), (pattern.length * gap + 1.2) * 1000);
  }
}

// POINT 20b: Resolve interval style — if random, pick from the three concrete options
function resolveIntervalStyle() {
  if (intervalStyle === 'random') {
    const opts = ['harmonic', 'ascending', 'descending'];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  return intervalStyle;
}

// POINT 20b: Resolve scale direction — if random, pick from the three concrete options
function resolveScaleDir() {
  if (scaleDirection === 'random') {
    const opts = ['asc', 'desc', 'both'];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  return scaleDirection;
}

// POINT 5: Play the current interval in the chosen style
function playInterval() {
  currentIntervalStyle = resolveIntervalStyle(); // POINT 20b: resolve + store for notation/breakdown
  playMidiNotes(currentIntervalMidi, currentIntervalStyle);
}

// POINT 7: Play the current scale in chosen direction
function playScale() {
  if (!piano || !currentScale) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setPlayingState(true);
  const now = audioCtx.currentTime;
  const gap = 0.38; // seconds per note

  const ascNotes  = currentScale.intervals.map(i => currentScaleRootMidi + i);
  const descNotes = [...ascNotes].reverse();

  currentScaleDir = resolveScaleDir(); // POINT 20b: resolve random and store for notation/breakdown
  if (answered) showNotation();        // sync notation to what's about to play
  let sequence;
  if (currentScaleDir === 'asc')  sequence = ascNotes;
  else if (currentScaleDir === 'desc') sequence = descNotes;
  else sequence = [...ascNotes, ...descNotes.slice(1)]; // both: up then down, share top note

  sequence.forEach((midi, i) => {
    piano.play(midiToSoundFontName(midi), now + i * gap, { duration: gap * 1.5, gain: 1.3 });
  });
  setTimeout(() => setPlayingState(false), (sequence.length * gap + 1.0) * 1000);
}

// POINT 8: "Hear slowly" — plays current sound at half speed
function playSlowly() {
  if (!piano || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setPlayingState(true);
  const now = audioCtx.currentTime;

  if (currentMode === 'scales') {
    const ascNotes  = currentScale.intervals.map(i => currentScaleRootMidi + i);
    const descNotes = [...ascNotes].reverse();
    const seq = currentScaleDir === 'desc' ? descNotes          // POINT 20b: use stored resolved dir
              : currentScaleDir === 'both' ? [...ascNotes, ...descNotes.slice(1)]
              : ascNotes;
    const gap = 0.76; // double the normal 0.38
    seq.forEach((midi, i) => {
      piano.play(midiToSoundFontName(midi), now + i * gap, { duration: gap * 1.5, gain: 1.3 });
    });
    setTimeout(() => setPlayingState(false), (seq.length * gap + 1.0) * 1000);
  } else if (currentMode === 'intervals') {
    const notes = currentIntervalStyle === 'descending' ? [...currentIntervalMidi].reverse() : [...currentIntervalMidi]; // POINT 20b: use stored style
    const gap = currentIntervalStyle === 'harmonic' ? 0 : 1.1;
    notes.forEach((midi, i) => {
      piano.play(midiToSoundFontName(midi), now + i * gap, { duration: 2.5, gain: 1.4 });
    });
    setTimeout(() => setPlayingState(false), (notes.length * gap + 2.5) * 1000);
  } else {
    // Chords: always slow arpeggio ascending regardless of playback style
    // POINT 25: merge bass note into full set for slash chords; POINT 26: poly/UST already merged
    const allNotes = currentChord?.family === 'slash' && currentSlashBassMidi !== null
      ? [currentSlashBassMidi, ...currentMidiNotes]
      : [...currentMidiNotes];
    const notes = allNotes.sort((a, b) => a - b);
    const gap = 0.5;
    notes.forEach((midi, i) => {
      piano.play(midiToSoundFontName(midi), now + i * gap, { duration: 2.5, gain: 1.4 });
    });
    setTimeout(() => setPlayingState(false), (notes.length * gap + 2.5) * 1000);
  }
}

// ─── Notation ─────────────────────────────────────────────────────────────────
// POINT 1: Exact-octave notation, auto grand staff.

function midiToVexKeyExact(midi) {
  const VEX_NOTES = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
  return VEX_NOTES[midi % 12] + '/' + (Math.floor(midi / 12) - 1);
}

// POINT 13: Updated to handle flat spellings properly (b note vs b accidental)
function addAccidentals(staveNote, keys, VF) {
  keys.forEach((key, i) => {
    const acc = vexAccidental(key);
    if (acc) staveNote.addModifier(new VF.Accidental(acc), i);
  });
}

// sequential=false → whole-note chord (chords/intervals)
// sequential=true  → row of quarter notes in order (scales)
// POINT 13: symbol + rootPc drive enharmonic spelling
// keySigStr: optional VexFlow key sig string e.g. 'Db', 'Bbm' — suppresses covered accidentals
function renderNotation(midiNotes, sequential, symbol, rootPc, keySigStr) {
  symbol = symbol || '';
  rootPc = rootPc ?? 0;
  const VF = (typeof Vex !== 'undefined' && Vex.Flow) ? Vex.Flow
           : (typeof VexFlow !== 'undefined') ? VexFlow : null;
  if (!VF) return;
  const { Renderer, Stave, StaveNote, StaveConnector, Voice, Formatter } = VF;

  const svg = document.getElementById('notation-svg');
  svg.innerHTML = '';

  // For chords: sort & dedupe. For scales: keep order as given.
  const notes = sequential ? [...midiNotes] : [...new Set(midiNotes)].sort((a, b) => a - b);
  const lowestMidi  = Math.min(...notes);
  const highestMidi = Math.max(...notes);
  const needsBass   = lowestMidi < 55;
  const needsTreble = highestMidi >= 55;
  const grandStaff  = needsBass && needsTreble;

  // Sequential (scale) mode: canvas is always as wide as needed — scrolling handles the rest.
  // Fixed per-beat width of 46px. Header space accounts for clef (~30px) + time sig (~20px)
  // + key sig (~14px per accidental). Formatter budget subtracts the same header so notes
  // are only distributed across the actual note-space, not the header area.
  const keySigCount = keySigStr ? keySigAccidentalCount(keySigStr) : 0;
  const headerPx = 30 + 20 + keySigCount * 14; // clef + timesig + keysig
  const barCount = sequential ? Math.ceil(notes.length / 4) : 1;
  const W = sequential ? barCount * 4 * 46 + headerPx + 40 : 260;
  let H, trebleY, bassY;
  if (grandStaff) { H = 240; trebleY = 20; bassY = 120; }
  else if (needsBass) { H = 140; bassY = 30; }
  else { H = 140; trebleY = 30; }

  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  const renderer = new Renderer(svg, Renderer.Backends.SVG);
  renderer.resize(W, H);
  const ctx = renderer.getContext();

  try {
    const STAVE_X = 20, STAVE_W = W - 30;
    let trebleStave, bassStave;

    // Letter-based key sig coverage (correct — not pitch-class based)
    const coveredLetters = keySigStr ? keySigCoveredLetters(keySigStr) : new Set();

    // Spell a midi note and, when a key sig is active, re-spell any double
    // accidentals to their enharmonic equivalent that fits the key.
    function spellMidi(midi) {
      let key = midiToVexKeySpelled(midi, pcInterval(midi % 12, rootPc), rootPc, symbol);
      if (keySigStr) key = respellForKeySig(midi, key, coveredLetters, keySigStr);
      return key;
    }

    // Add accidentals for a StaveNote, skipping any already in the key sig.
    // keys: array of vex key strings (already respelled).
    function addAccidentalsFiltered(sn, keys) {
      keys.forEach((key, i) => {
        if (isCoveredByKeySig(key, coveredLetters)) return; // key sig handles it
        const acc = vexAccidental(key);
        if (acc) sn.addModifier(new VF.Accidental(acc), i);
      });
    }

    if (needsTreble || grandStaff) {
      trebleStave = new Stave(STAVE_X, trebleY, STAVE_W);
      trebleStave.addClef('treble');
      if (keySigStr) trebleStave.addKeySignature(keySigStr);
      trebleStave.setContext(ctx).draw();
    }
    if (needsBass || grandStaff) {
      bassStave = new Stave(STAVE_X, bassY, STAVE_W);
      bassStave.addClef('bass');
      if (keySigStr) bassStave.addKeySignature(keySigStr);
      bassStave.setContext(ctx).draw();
    }
    if (grandStaff && trebleStave && bassStave) {
      try {
        new StaveConnector(trebleStave, bassStave).setType('brace').setContext(ctx).draw();
        new StaveConnector(trebleStave, bassStave).setType('singleLeft').setContext(ctx).draw();
      } catch(e) {}
    }

    if (sequential) {
      // ── Sequential: 4/4, quarter notes, bar lines, correct rests to fill last bar ──
      const clef  = needsBass && !needsTreble ? 'bass' : 'treble';
      const stave = needsBass && !needsTreble ? bassStave : trebleStave;

      stave.addTimeSignature('4/4');
      stave.setContext(ctx).draw();

      const noteTicks = notes.map(midi => {
        const key = spellMidi(midi);
        const sn = new StaveNote({ keys: [key], duration: 'q', clef });
        addAccidentalsFiltered(sn, [key]);
        return sn;
      });

      const remainder = notes.length % 4;
      const restTicks = [];
      if (remainder !== 0) {
        const fill = 4 - remainder;
        const restKey = clef === 'bass' ? 'a/2' : 'b/4';
        if (fill === 3) {
          restTicks.push(new StaveNote({ keys: [restKey], duration: 'hdr', clef }));
        } else if (fill === 2) {
          restTicks.push(new StaveNote({ keys: [restKey], duration: 'hr', clef }));
        } else {
          restTicks.push(new StaveNote({ keys: [restKey], duration: 'qr', clef }));
        }
      }

      const allTicks = [...noteTicks, ...restTicks];
      const tickables = [];
      for (let i = 0; i < allTicks.length; i++) {
        if (i > 0 && i % 4 === 0) tickables.push(new VF.BarNote());
        tickables.push(allTicks[i]);
      }

      const totalBeats = Math.ceil(notes.length / 4) * 4;
      const voice = new Voice({ num_beats: totalBeats, beat_value: 4 }).setMode(Voice.Mode.SOFT);
      voice.addTickables(tickables);
      const formatterBudget = STAVE_W - headerPx - 20;
      new Formatter().joinVoices([voice]).format([voice], formatterBudget);
      voice.draw(ctx, stave);

    } else {
      // ── Block chord: all notes as a single whole-note chord, grand staff if needed ──
      const sorted = notes;
      let trebleArr = [], bassArr = [];
      if (grandStaff) { sorted.forEach(m => (m >= 60 ? trebleArr : bassArr).push(m)); }
      else if (needsBass) { bassArr = sorted; }
      else { trebleArr = sorted; }

      function drawChordNotes(midiArr, clef, stave) {
        if (!midiArr.length || !stave) return;
        const keys = midiArr.map(m => spellMidi(m));
        const sn = new StaveNote({ keys, duration: 'w', clef });
        addAccidentalsFiltered(sn, keys);
        const voice = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
        voice.addTickables([sn]);
        new Formatter().joinVoices([voice]).format([voice], STAVE_W - 60);
        voice.draw(ctx, stave);
      }

      function drawRest(key, clef, stave) {
        if (!stave) return;
        const rest = new StaveNote({ keys: [key], duration: 'wr', clef });
        const voice = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
        voice.addTickables([rest]);
        new Formatter().joinVoices([voice]).format([voice], STAVE_W - 60);
        voice.draw(ctx, stave);
      }

      if (grandStaff) {
        trebleArr.length ? drawChordNotes(trebleArr, 'treble', trebleStave) : drawRest('b/4', 'treble', trebleStave);
        bassArr.length   ? drawChordNotes(bassArr,   'bass',   bassStave)   : drawRest('d/3', 'bass',   bassStave);
      } else if (needsBass) {
        drawChordNotes(bassArr, 'bass', bassStave);
      } else {
        drawChordNotes(trebleArr, 'treble', trebleStave);
      }
    }
  } catch(e) { console.error('VexFlow render error:', e); }
}

// POINT 25: Label for slash chord root badge (shows upper root)
function getSlashChordRootLabel() {
  if (!currentUpperRootMidi) return '';
  const pc = currentUpperRootMidi % 12;
  return spelledRoot(pc);
}

// POINT 25 (redesigned): Resolved slash chord name for the current question, e.g. "B/C" or
// "Bm/C" — built from the randomised root each question, since the type itself is root-agnostic.
function getSlashResolvedName() {
  if (currentUpperRootMidi === null || currentSlashBassMidi === null) return '';
  const upperPc = currentUpperRootMidi % 12;
  const bassPc  = currentSlashBassMidi % 12;
  const upperName = spelledRoot(upperPc);
  const bassName  = spelledNote(currentChord.bassInterval, upperPc, currentChord.symbol);
  const qualSuffix = currentChord.upperQuality === 'min' ? 'm' : '';
  return upperName + qualSuffix + '/' + bassName;
}

// POINT 34: Quality suffix/full-name helpers — support aug and dom7 upper/lower
function polyQualitySuffix(sym) {
  if (sym === 'min') return 'm';
  if (sym === 'aug') return 'aug';
  if (sym === '7')   return '7';
  return ''; // maj
}
function polyQualityFull(sym) {
  if (sym === 'min') return 'minor';
  if (sym === 'aug') return 'augmented';
  if (sym === '7')   return 'dominant 7th';
  return 'major';
}

// POINT 26: Polychord display label e.g. "E / A", "Eaug / A", "E7 / Am"
function getPolyChordLabel() {
  if (!currentPolyUpperRootMidi || !currentPolyLowerRootMidi) return currentChord.name;
  const upPc  = currentPolyUpperRootMidi % 12;
  const loPC  = currentPolyLowerRootMidi % 12;
  const upName = spelledRoot(upPc);
  const loName = spelledRoot(loPC);
  return upName + polyQualitySuffix(currentChord.upperSymbol) + ' / ' + loName + polyQualitySuffix(currentChord.lowerSymbol);
}

// POINT 26 / 35: UST display label — adapts to shell quality
// Dom7 shell: "UST ♭II over G7 → G7(♭9)(♯11)(♭13)"
// m7 shell:   "UST IIm over Gm7 → Gm7(9)(11)"
// Maj7 shell: "UST II over GMaj7 → GMaj7(9)(♯11)"
function getUSTLabel() {
  if (!currentUSTRootMidi) return currentChord.name;
  const rootPc   = currentUSTRootMidi % 12;
  const rootName = spelledRoot(rootPc);
  const shellSuffix = currentChord.shellQuality === 'min'  ? 'm7'
                    : currentChord.shellQuality === 'maj7' ? 'Maj7'
                    : '7';
  return 'UST ' + currentChord.ustNumber + ' over ' + rootName + shellSuffix + ' → ' + rootName + currentChord.resultingChord;
}

// POINT 2 / 13: Derive harmonic root name for inverted chords, spelled correctly
function getChordRootName() {
  // POINT 25: slash chords show upper chord root
  if (currentChord?.family === 'slash') return getSlashChordRootLabel();
  // POINT 26: poly shows upper triad root; UST shows chord root
  if (currentChord?.family === 'poly' && currentPolyUpperRootMidi) {
    return spelledRoot(currentPolyUpperRootMidi % 12);
  }
  if (currentChord?.family === 'ust' && currentUSTRootMidi) {
    return spelledRoot(currentUSTRootMidi % 12);
  }
  if (currentChord && currentChord.invIndex !== undefined) {
    const bassNote = currentMidiNotes[0];
    const bassInterval = currentChord.baseChord.intervals[currentChord.invIndex];
    const rootMidi = bassNote - bassInterval;
    return spelledRoot(((rootMidi % 12) + 12) % 12);
  }
  return spelledRoot(((currentChordRootMidi ?? currentMidiNotes[0]) % 12 + 12) % 12);
}

// Context-aware numeral lookup. Pass symbol so ambiguous semitone counts
// resolve to the correct degree name for the chord/scale in question.
function semitonesToNumeral(semitones, symbol) {

}
